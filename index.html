<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23c8a66b'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%236b4f31'/%3E%3C/svg%3E"
    />
    <title>飞飞鼠</title>
    <style>
      :root {
        --site-bg: #000;
        --site-fg: #e6e6e6;
        --site-accent: #fff;
        --site-on-accent: #000;
        --site-surface: #fff;
        --site-muted: #9a9a9a;
        --site-border: #222;
        --site-font: "字小魂萌萌哒体", system-ui, -apple-system, "Segoe UI", Roboto,
          sans-serif;
        --site-radius: 12px;
        --site-space: 1;
        --site-type: 1;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--site-bg);
        color: var(--site-fg);
        font-family: var(--site-font);
      }

      body {
        display: flex;
        flex-direction: column;
      }

      #game {
        flex: 1;
        min-height: 0;
      }

      #game canvas {
        border-radius: var(--site-radius);
        outline: none;
      }

      .hint {
        margin: 0;
        padding: calc(8px * var(--site-space)) calc(16px * var(--site-space))
          calc(16px * var(--site-space));
        border-top: 1px solid var(--site-border);
        text-align: center;
        font-size: calc(14px * var(--site-type));
        color: var(--site-muted);
      }

      .hint kbd {
        padding: 2px 6px;
        border: 1px solid var(--site-accent);
        border-radius: calc(var(--site-radius) / 3);
        background: var(--site-surface);
        color: var(--site-on-accent);
        font-family: var(--site-font);
        font-size: inherit;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <p class="hint">点击画面后，用 <kbd>方向键</kbd> 或 <kbd>WASD</kbd> 移动</p>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
